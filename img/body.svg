    .b{fill:#eef0f3;stroke:#9aa1ab;stroke-width:1.5}
    .m{fill:#dfe3e8;stroke:#9aa1ab;stroke-width:1}
    .m.on{fill:#e8590c;stroke:#b54708}
    text{font:11px sans-serif;fill:#555;text-anchor:middle}
  </style>
  <!-- 前 -->
  <g transform="translate(15,0)">
