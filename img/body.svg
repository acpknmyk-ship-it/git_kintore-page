    <rect class="b" x="6" y="46" width="14" height="78" rx="7"/>
    <rect class="b" x="80" y="46" width="14" height="78" rx="7"/>
    <rect class="b" x="27" y="128" width="21" height="100" rx="9"/>
    <rect class="b" x="52" y="128" width="21" height="100" rx="9"/>
    <ellipse class="m" data-m="kata" cx="15" cy="52" rx="10" ry="9"/>
    <ellipse class="m" data-m="kata" cx="85" cy="52" rx="10" ry="9"/>
    <rect class="m" data-m="mune" x="28" y="48" width="21" height="20" rx="6"/>
