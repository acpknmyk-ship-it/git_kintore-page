    <rect class="m" data-m="ude_mae" x="82" y="64" width="10" height="24" rx="5"/>
    <rect class="m" data-m="hara" x="36" y="72" width="28" height="46" rx="7"/>
    <rect class="m" data-m="momo_mae" x="29" y="134" width="17" height="42" rx="7"/>
    <rect class="m" data-m="momo_mae" x="54" y="134" width="17" height="42" rx="7"/>
